<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hệ thống quản lý thư viện</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===================================== -->
    <!-- HEADER -->
    <!-- ===================================== -->

    <div id="header"></div>


    <!-- ===================================== -->
    <!-- LAYOUT CHÍNH -->
    <!-- ===================================== -->

    <div class="app-layout">

        <!-- ================================= -->
        <!-- SIDEBAR -->
        <!-- ================================= -->

        <div id="sidebar"></div>


        <!-- ================================= -->
        <!-- NỘI DUNG CHÍNH -->
        <!-- ================================= -->

        <main class="container">

            <!-- ============================= -->
            <!-- 2 TAB TRANG CHỦ -->
            <!-- ============================= -->

            <div id="homeTabs"></div>


            <!-- ============================= -->
            <!-- TẤT CẢ SÁCH -->
            <!-- ============================= -->

            <div id="allBooks"></div>


            <!-- ============================= -->
            <!-- SÁCH ĐANG ĐƯỢC QUAN TÂM -->
            <!-- ============================= -->

            <div id="trendingBooks"></div>


            <!-- ============================= -->
            <!-- QUẢN LÝ SÁCH -->
            <!-- ============================= -->

            <div id="bookManagement"></div>


            <!-- ============================= -->
            <!-- ĐĂNG KÝ THÀNH VIÊN -->
            <!-- ============================= -->

            <div id="memberRegister"></div>


            <!-- ============================= -->
            <!-- TÌM KIẾM SÁCH -->
            <!-- ============================= -->

            <div id="searchBook"></div>


            <!-- ============================= -->
            <!-- TÌM THEO NĂM -->
            <!-- ============================= -->

            <div id="searchBookByYear"></div>

            <!-- ============================= -->
            <!-- MƯỢN SÁCH -->
            <!-- ============================= -->

            <div id="borrowBook"></div>


            <!-- ============================= -->
            <!-- ĐĂNG KÝ CHỜ MƯỢN -->
            <!-- ============================= -->

            <div id="reservation"></div>


            <!-- ============================= -->
            <!-- TRẢ SÁCH -->
            <!-- ============================= -->

            <div id="returnBook"></div>


            <!-- ============================= -->
            <!-- PHIẾU MƯỢN -->
            <!-- ============================= -->

            <div id="loanSlip"></div>


            <!-- ============================= -->
            <!-- TIỀN PHẠT -->
            <!-- ============================= -->

            <div id="fine"></div>

        </main>

    </div>


    <!-- ===================================== -->
    <!-- FOOTER -->
    <!-- ===================================== -->

    <div id="footer"></div>


    <!-- ===================================== -->
    <!-- JAVASCRIPT CHÍNH -->
    <!-- ===================================== -->

    <script type="module" src="script.js"></script>

</body>

</html>
