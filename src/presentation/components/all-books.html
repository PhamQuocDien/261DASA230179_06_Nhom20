            Danh sách toàn bộ sách hiện có trong thư viện
        </p>

    </div>


    <!-- ===================================== -->

    <section class="book-list">

        <h3>

        <table>

                <tr>

                    <th id="bookIdHeader"

                    <th>

                    </th>


                    <th>
                        Tên sách

                    <th>

                    <th>

            </tbody>

        </table>

        <div id="bookPagination"

<!-- ========================================= -->
<!-- STYLE PHÂN TRANG -->
<!-- ========================================= -->

<style>

    .book-pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
        padding: 10px 0;
    }


    .book-pagination-button {
        min-width: 40px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid #33415c;
        border-radius: 8px;
        background: #172033;
        color: #dce6f7;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }


        .book-pagination-button:hover {
            background: #24314a;
            border-color: #4b628a;
            transform: translateY(-1px);
        }


        .book-pagination-button.active {
            background: #315bdc;
            border-color: #315bdc;
            color: white;
            cursor: default;
        }


        .book-pagination-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }


    .book-pagination-ellipsis {
        min-width: 24px;
        text-align: center;
        color: #9aa8c0;
        font-size: 14px;
        font-weight: 600;
    }


    .book-id-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 320px;
    }


    .book-id-item {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(49, 91, 220, 0.12);
        border: 1px solid rgba(49, 91, 220, 0.25);
        font-size: 13px;
        white-space: nowrap;
    }
</style>
