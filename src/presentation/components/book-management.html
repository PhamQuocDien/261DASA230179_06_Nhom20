<section class="book-management-section">
    <div class="section-header">
        <h2>Quản lý sách</h2>
        <p>Thêm, tìm, sửa và xóa thông tin sách</p>
    </div>
    <section class="book-form">
        <h3>Thông tin sách</h3>
        <label for="bookCode">Mã sách</label>
        <input type="text" id="bookCode" placeholder="Nhập mã sách">
        <label for="bookId">Mã bản sách vật lý</label>
        <input type="text" id="bookId" placeholder="Nhập Book_ID, để trống nếu xóa toàn bộ">
        <label for="title">Tên sách</label>
        <input type="text" id="title" placeholder="Nhập tên sách">
        <label for="author">Tác giả</label>
        <input type="text" id="author" placeholder="Nhập tác giả">
        <label for="category">Thể loại</label>
        <input type="text" id="category" placeholder="Nhập thể loại">
        <label for="year">Năm xuất bản</label>
        <input type="number" id="year" placeholder="Nhập năm xuất bản">
        <label for="quantity">Số lượng cuốn vật lý</label>
        <input type="number" id="quantity" min="1" placeholder="Nhập số lượng cuốn">
        <div class="buttons">
            <button id="btnCreate" type="button">Thêm sách</button>
            <button id="btnRead" type="button">Tìm sách</button>
            <button id="btnUpdate" type="button">Sửa sách</button>
            <button id="btnAddCopy" type="button">Thêm cuốn vật lý</button>
            <button id="btnDelete" type="button">Xóa sách</button>
            <button id="btnReset" type="button">Làm mới</button>
        </div>
        <div id="bookMessage" class="book-message"></div>
    </section>
</section>
