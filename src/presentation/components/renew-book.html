<!-- RENEW BOOK -->
<!-- GIA HẠN MƯỢN SÁCH -->
<!-- ========================================= -->

<section class="renew-book-section">
    <div class="section-header">
        <h2>Gia hạn mượn sách</h2>
        <p>Gia hạn thời gian mượn cho một phiếu mượn.</p>
    </div>

    <div class="renew-book-form">
        <div class="form-group">
            <label for="renewLoanId">Loan_ID</label>
            <input type="text" id="renewLoanId" placeholder="Nhập Loan_ID...">
        </div>

        <div class="form-group">
            <label for="renewPassword">Mật khẩu thành viên</label>
            <input type="password" id="renewPassword" placeholder="Nhập mật khẩu..." autocomplete="current-password">
            <p class="form-hint">Hệ thống sẽ đối chiếu mật khẩu với thành viên đang sở hữu phiếu mượn.</p>
        </div>

        <button type="button" id="btnRenewBook">
            Gia hạn
        </button>
    </div>

    <div class="renew-book-result">
        <h3>Kết quả</h3>
        <div id="renewBookResult">
            <p>Chưa thực hiện gia hạn.</p>
        </div>
    </div>
</section>
