<!-- ========================================= -->
<!-- LOAN SLIP -->
<!-- PHIẾU MƯỢN -->
<!-- ========================================= -->

<section class="loan-slip-section">

    <div class="section-header">

        <h2>
            Phiếu mượn sách
        </h2>

        <p>
            Xem các sách đang được mượn theo Member_ID
        </p>

    </div>


    <!-- ===================================== -->
    <!-- TRA CỨU -->
    <!-- ===================================== -->

    <div class="loan-slip-search">

        <label for="memberId">
            Member_ID
        </label>

        <input type="text"
               id="memberId"
               placeholder="Nhập Member_ID...">


        <button type="button"
                id="btnLoadLoanSlips">
            Xem sách đang mượn
        </button>

    </div>


    <!-- ===================================== -->
    <!-- DANH SÁCH SÁCH ĐANG MƯỢN -->
    <!-- ===================================== -->

    <div class="loan-slip-list">

        <h3>
            Sách đang được mượn
        </h3>


        <div id="loanSlipList">

            <p>
                Chưa có dữ liệu sách đang mượn.
            </p>

        </div>

    </div>

</section>
