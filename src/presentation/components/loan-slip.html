<!-- ========================================= -->
<!-- LOAN SLIP -->
<!-- PHIẾU MƯỢN -->
<!-- ========================================= -->

<section class="loan-slip-section">

    <div class="section-header">

        <h2>
            Phiếu mượn sách
        </h2>

        <p>
            Xem phiếu mượn theo Member_ID
        </p>

    </div>


    <!-- ===================================== -->
    <!-- TRA CỨU -->
    <!-- ===================================== -->

    <div class="loan-slip-search">

        <label for="memberId">
            Member_ID
        </label>

        <input type="text"
               id="memberId"
               placeholder="Nhập Member_ID...">


        <button type="button"
                id="btnLoadLoanSlips">
            Xem phiếu mượn
        </button>

    </div>


    <!-- ===================================== -->
    <!-- DANH SÁCH PHIẾU MƯỢN -->
    <!-- ===================================== -->

    <div class="loan-slip-list">

        <div class="loan-slip-tabs">

            <button type="button"
                    id="tabBorrowing"
                    class="loan-slip-tab active">
                Sách đang được mượn
            </button>

            <button type="button"
                    id="tabReturned"
                    class="loan-slip-tab">
                Sách đã trả
            </button>

        </div>


        <div id="borrowingLoanSlipList"
             class="loan-slip-tab-content">

            <p>
                Chưa có dữ liệu sách đang mượn.
            </p>

        </div>


        <div id="returnedLoanSlipList"
             class="loan-slip-tab-content"
             style="display: none;">

            <p>
                Chưa có dữ liệu sách đã trả.
            </p>

        </div>

    </div>

</section>
