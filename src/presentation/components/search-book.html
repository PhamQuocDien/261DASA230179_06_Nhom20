<section class="search-book-section">

    <div class="section-header">

        <h2>
            Tìm kiếm sách
        </h2>

        <p>
            Tra cứu sách theo Book Code hoặc Tên sách
        </p>

    </div>

    <div class="search-book-form">

        <label for="searchBookType">
            Tìm theo
        </label>

        <select id="searchBookType">

            <option value="bookCode">
                Book Code
            </option>

            <option value="title">
                Tên sách
            </option>

        </select>


        <label for="searchBookKeyword">
            Từ khóa
        </label>

        <input
            type="text"
            id="searchBookKeyword"
            placeholder="Nhập Book Code..."
        >


        <button
            type="button"
            id="btnSearchBook"
        >
            Tìm kiếm
        </button>

    </div>


    <div class="search-book-result">

        <h3>
            Kết quả tìm kiếm
        </h3>

        <div id="searchBookResult">

            <p>
                Chưa có kết quả tìm kiếm.
            </p>

        </div>

    </div>

</section>
