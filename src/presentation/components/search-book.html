<!-- ========================================= -->
<!-- SEARCH BOOK -->
<!-- MC1 - TRA CỨU SÁCH -->
<!-- ========================================= -->

<section class="search-book-section">

    <div class="section-header">

        <h2>
            Tìm kiếm sách
        </h2>

        <p>
            Tra cứu thông tin sách theo Book_ID hoặc Tên sách
        </p>

    </div>


    <!-- ===================================== -->
    <!-- CHỌN CÁCH TÌM -->
    <!-- ===================================== -->

    <div class="search-book-form">

        <label for="searchBookType">
            Tìm theo
        </label>

        <select id="searchBookType">

            <option value="bookId">
                Book_ID
            </option>

            <option value="title">
                Tên sách
            </option>

        </select>


        <!-- ================================= -->
        <!-- Ô NHẬP -->
        <!-- ================================= -->

        <label for="searchBookKeyword">
            Từ khóa
        </label>

        <input
            type="text"
            id="searchBookKeyword"
            placeholder="Nhập Book_ID..."
        >


        <button
            type="button"
            id="btnSearchBook"
        >
            Tìm kiếm
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ -->
    <!-- ===================================== -->

    <div class="search-book-result">

        <h3>
            Kết quả tìm kiếm
        </h3>


        <div id="searchBookResult">

            <p>
                Chưa có kết quả tìm kiếm.
            </p>

        </div>

    </div>

</section>
