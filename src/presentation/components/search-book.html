<!-- ========================================= -->
<!-- SEARCH BOOK -->
<!-- MC1 - TRA CỨU CHÍNH XÁC BOOK_ID -->
<!-- ========================================= -->

<section class="search-book-section">

    <div class="section-header">

        <h2>
            Tìm kiếm sách
        </h2>

        <p>
            Tra cứu chính xác thông tin sách theo Book_ID
        </p>

    </div>


    <!-- ===================================== -->
    <!-- Ô NHẬP BOOK_ID -->
    <!-- ===================================== -->

    <div class="search-book-form">

        <label for="searchBookId">
            Book_ID
        </label>

        <input type="text"
               id="searchBookId"
               placeholder="Nhập Book_ID...">


        <button type="button"
                id="btnSearchBook">
            Tìm kiếm
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ TÌM KIẾM -->
    <!-- ===================================== -->

    <div class="search-book-result">

        <h3>
            Kết quả tìm kiếm
        </h3>


        <div id="searchBookResult">

            <p>
                Chưa có kết quả tìm kiếm.
            </p>

        </div>

    </div>

</section>
