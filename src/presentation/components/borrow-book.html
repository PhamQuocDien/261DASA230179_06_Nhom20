<!-- ========================================= -->
<!-- BORROW BOOK -->
<!-- MƯỢN SÁCH -->
<!-- ========================================= -->

<section class="borrow-book-section">

    <div class="section-header">

        <h2>
            Mượn sách
        </h2>

        <p>
            Tạo phiếu mượn sách cho thành viên
        </p>

    </div>


    <!-- ===================================== -->
    <!-- THÔNG TIN MƯỢN -->
    <!-- ===================================== -->

    <div class="borrow-book-form">

        <div class="form-group">

            <label for="borrowMemberId">
                Member_ID
            </label>

            <input type="text"
                   id="borrowMemberId"
                   placeholder="Nhập Member_ID...">

        </div>


        <div class="form-group">

            <label for="borrowBookId">
                Book_ID
            </label>

            <input type="text"
                   id="borrowBookId"
                   placeholder="Nhập Book_ID...">

        </div>


        <button type="button"
                id="btnBorrowBook">
            Mượn sách
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ -->
    <!-- ===================================== -->

    <div class="borrow-book-result">

        <h3>
            Kết quả
        </h3>


        <div id="borrowBookResult">

            <p>
                Chưa thực hiện mượn sách.
            </p>

        </div>

    </div>

</section>
