<!-- ========================================= -->
<!-- RETURN BOOK -->
<!-- TRẢ SÁCH -->
<!-- ========================================= -->

<section class="return-book-section">

    <div class="section-header">

        <h2>
            Trả sách
        </h2>

        <p>
            Xử lý việc trả sách đang được mượn
        </p>

    </div>


    <!-- ===================================== -->
    <!-- THÔNG TIN TRẢ -->
    <!-- ===================================== -->

    <div class="return-book-form">

        <div class="form-group">
            <label for="returnLoanId">Loan_ID</label>
            <input type="text"
                   id="returnLoanId"
                   placeholder="Nhập Loan_ID...">
        </div>

        <div class="form-group">
            <label for="returnDate">Ngày trả</label>
            <input type="date" id="returnDate">
        </div>

        <div class="form-group">
            <label for="returnQuality">Tình trạng sách</label>
            <select id="returnQuality">
                <option value="Tot">Tốt</option>
                <option value="Kha">Khá</option>
                <option value="Trung binh">Trung bình</option>
                <option value="Kem">Kém</option>
            </select>
        </div>

        <div class="form-group">
            <label for="returnConfirmation">Mã xác nhận</label>
            <input type="password"
                   id="returnConfirmation"
                   placeholder="Nhập mã xác nhận...">
        </div>

        <button type="button" id="btnReturnBook">
            Xác nhận trả sách
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ -->
    <!-- ===================================== -->

    <div class="return-book-result">

        <h3>
            Kết quả
        </h3>


        <div id="returnBookResult">

            <p>
                Chưa thực hiện trả sách.
            </p>

        </div>

    </div>

</section>
