<!-- TRẢ SÁCH -->

<section class="return-book-section">

    <div class="section-header">

        <h2>
            Trả sách
        </h2>

        <p>
            Xử lý việc trả sách đang được mượn
        </p>

    </div>


    <!-- ===================================== -->
    <!-- THÔNG TIN TRẢ -->
    <!-- ===================================== -->

    <div class="return-book-form">

        <div class="form-group">

            <label for="returnLoanId">
                Loan_ID
            </label>

            <input type="text"
                   id="returnLoanId"
                   placeholder="Nhập Loan_ID...">

        </div>


        <button type="button"
                id="btnReturnBook">
            Trả sách
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ -->
    <!-- ===================================== -->

    <div class="return-book-result">

        <h3>
            Kết quả
        </h3>


        <div id="returnBookResult">

            <p>
                Chưa thực hiện trả sách.
            </p>

        </div>

    </div>

</section>
