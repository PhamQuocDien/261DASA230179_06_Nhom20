<section class="fine-section">

    <div class="section-header">

        <h2>
            Tra cứu tiền phạt
        </h2>

        <p>
            Tra cứu thông tin tiền phạt của phiếu mượn
        </p>

    </div>


    <!-- ===================================== -->
    <!-- TRA CỨU -->
    <!-- ===================================== -->

    <div class="fine-search">

        <label for="fineLoanId">
            Loan_ID
        </label>

        <input type="text"
               id="fineLoanId"
               placeholder="Nhập Loan_ID...">


        <button type="button"
                id="btnSearchFine">
            Tra cứu
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ -->
    <!-- ===================================== -->

    <div class="fine-result">

        <h3>
            Kết quả
        </h3>


        <div id="fineResult">

            <p>
                Chưa có kết quả tra cứu.
            </p>

        </div>

    </div>

</section>
