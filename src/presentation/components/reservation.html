<!-- ========================================= -->
<!-- RESERVATION -->
<!-- ĐĂNG KÝ CHỜ MƯỢN SÁCH -->
<!-- ========================================= -->

<section class="reservation-section">

    <div class="section-header">

        <h2>
            Đăng ký chờ mượn sách
        </h2>

        <p>
            Đăng ký chờ mượn sách khi sách hiện đang được mượn
        </p>

    </div>


    <!-- ===================================== -->
    <!-- 2 CỘT -->
    <!-- ===================================== -->

    <div class="reservation-layout">


        <!-- ================================= -->
        <!-- BÊN TRÁI: ĐĂNG KÝ CHỜ -->
        <!-- ================================= -->

        <div class="reservation-register-panel">

            <div class="reservation-panel-header">

                <h3>
                    Đăng ký chờ
                </h3>

                <p>
                    Nhập Member_ID và Book_ID để đăng ký.
                </p>

            </div>


            <div class="reservation-form">

                <div class="form-group">

                    <label for="reservationMemberId">
                        Member_ID
                    </label>

                    <input type="text"
                           id="reservationMemberId"
                           placeholder="Nhập Member_ID...">

                </div>


                <div class="form-group">

                    <label for="reservationBookId">
                        Book_ID
                    </label>

                    <input type="text"
                           id="reservationBookId"
                           placeholder="Nhập Book_ID...">

                </div>


                <button type="button"
                        id="btnReservation">
                    Đăng ký chờ mượn
                </button>

            </div>


            <!-- ================================= -->
            <!-- KẾT QUẢ ĐĂNG KÝ -->
            <!-- ================================= -->

            <div class="reservation-result">

                <h3>
                    Kết quả đăng ký
                </h3>


                <div id="reservationResult">

                    <p>
                        Chưa thực hiện đăng ký.
                    </p>

                </div>

            </div>

        </div>


        <!-- ================================= -->
        <!-- BÊN PHẢI: TRA CỨU DANH SÁCH CHỜ -->
        <!-- ================================= -->

        <div class="reservation-queue-panel">

            <div class="reservation-panel-header">

                <h3>
                    Danh sách đăng ký chờ
                </h3>

                <p>
                    Nhập Book_ID để xem những thành viên đang chờ.
                </p>

            </div>


            <!-- ================================= -->
            <!-- Ô TRA CỨU -->
            <!-- ================================= -->

            <div class="reservation-lookup">

                <div class="form-group">

                    <label for="reservationLookupBookId">
                        Book_ID
                    </label>

                    <input type="text"
                           id="reservationLookupBookId"
                           placeholder="Nhập Book_ID cần tra cứu...">

                </div>


                <button type="button"
                        id="btnReservationLookup">
                    Tra cứu
                </button>

            </div>


            <!-- ================================= -->
            <!-- DANH SÁCH ĐANG CHỜ -->
            <!-- ================================= -->

            <div id="reservationQueueResult"
                 class="reservation-queue-result">

                <p>
                    Nhập Book_ID để tra cứu danh sách đăng ký chờ.
                </p>

            </div>

        </div>

    </div>

</section>
