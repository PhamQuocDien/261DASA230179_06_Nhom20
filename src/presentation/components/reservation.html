<!-- ========================================= -->
<!-- RESERVATION -->
<!-- ĐĂNG KÝ CHỜ MƯỢN SÁCH -->
<!-- ========================================= -->

<section class="reservation-section">

    <div class="section-header">

        <h2>
            Đăng ký chờ mượn sách
        </h2>

        <p>
            Đăng ký chờ mượn sách khi sách hiện đang được mượn
        </p>

    </div>


    <!-- ===================================== -->
    <!-- THÔNG TIN ĐĂNG KÝ -->
    <!-- ===================================== -->

    <div class="reservation-form">

        <div class="form-group">

            <label for="reservationMemberId">
                Member_ID
            </label>

            <input type="text"
                   id="reservationMemberId"
                   placeholder="Nhập Member_ID...">

        </div>


        <div class="form-group">

            <label for="reservationBookId">
                Book_ID
            </label>

            <input type="text"
                   id="reservationBookId"
                   placeholder="Nhập Book_ID...">

        </div>


        <button type="button"
                id="btnReservation">
            Đăng ký chờ mượn
        </button>

    </div>


    <!-- ===================================== -->
    <!-- KẾT QUẢ -->
    <!-- ===================================== -->

    <div class="reservation-result">

        <h3>
            Kết quả
        </h3>


        <div id="reservationResult">

            <p>
                Chưa thực hiện đăng ký.
            </p>

        </div>

    </div>

</section>
